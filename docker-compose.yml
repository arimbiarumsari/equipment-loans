services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-equipment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-equipment}
      POSTGRES_DB: ${DB_NAME:-equipment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-equipment}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports": the database is reachable only inside the Docker network.

  api:
    image: ${API_IMAGE:-equipment-api:latest}
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipment}:${DB_PASSWORD:-equipment}@db:5432/${DB_NAME:-equipment}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
